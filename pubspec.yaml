name: gym_tracker_app
description: "A Flutter app for gym enthusiasts to track diet and workout."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & Scanning
  http: ^1.6.0
  mobile_scanner: ^7.4.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  bcrypt: ^1.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  cupertino_icons: ^1.0.8
  gap: ^3.0.1

  # Animations
  lottie: ^3.6.1
  awesome_dialog: ^3.3.0
  rive: ^0.14.11
  confetti: ^0.8.0
  flame: ^1.38.2
  animations: ^2.2.0
  flutter_native_splash: ^2.4.8
  
  # Test
  wave_blob: ^1.0.5 
  glowstone: ^0.0.2
  ripple_wave: ^0.1.5
  advanced_shimmer: ^1.0.2
  auto_shimmer_animate: ^0.2.1
  empty_view: ^2.1.1
  # flow_button: ^1.0.0 require 3.13 dart sdk but currently i have 3.12 
  simple_reveal: ^0.1.4
  flutter_animate_plus: ^5.1.0
  m3e_haptics: ^0.0.1
  # haptic_patterns: ^1.0.0 require more dependencies with that
  # m3e_core: ^0.1.6 require other dependencies
  button_animations: ^2.0.0+3
  animated_icon_button: ^1.0.2 #latest version
  flutter_animate: ^4.5.2
  pressable: ^0.12.0
  haptic_feedback: ^0.6.5
  # s_packages: ^5.6.1  creating issues 
  #requiered for s_package 
  # dart_helper_utils: ^6.1.0
  simple_ripple_animation: ^0.1.1
  scale_button: ^2.1.2
  flutter_scale_tap: ^1.0.5
  flutter_bounce: ^1.1.0
  flutter_bounceable: ^1.2.0
  bouncy_button: ^1.0.4
  haptic_kit: ^2.3.0
  advanced_haptics: ^1.2.0
  on_process_button_widget: ^2.1.0


  # Fonts
  # google_fonts: ^9.0.0
  google_fonts: ^8.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter_launcher_icons:
  android: "launch_background"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    # - assets/animations/
    - shorebird.yaml